<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechNotes — Build Order</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--s1:#111;--s2:#181818;--border:#2a2a2a;--text:#ddd;--dim:#888;--muted:#555;--ph1:#4a9;--ph2:#49a;--ph3:#a94;--ph4:#944}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.6}
.header{padding:40px 48px 20px;border-bottom:1px solid var(--border)}
.header h1{font-size:24px;font-weight:600;margin-bottom:4px}
.header p{color:var(--dim);font-size:12px}
.controls{padding:14px 48px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls span{color:var(--dim);font-size:11px;margin-right:8px}
button.ph{padding:6px 16px;border:1px solid var(--border);background:var(--s1);color:var(--dim);font-size:11px;font-family:inherit;cursor:pointer;border-radius:3px}
button.ph:hover{border-color:var(--dim);color:var(--text)}
button.ph.on[data-p="1"]{border-color:var(--ph1);color:var(--ph1);background:rgba(68,170,153,0.1)}
button.ph.on[data-p="2"]{border-color:var(--ph2);color:var(--ph2);background:rgba(68,153,170,0.1)}
button.ph.on[data-p="3"]{border-color:var(--ph3);color:var(--ph3);background:rgba(170,153,68,0.1)}
button.ph.on[data-p="4"]{border-color:var(--ph4);color:var(--ph4);background:rgba(153,68,68,0.1)}
#count{margin-left:auto;color:var(--muted);font-size:11px}
#graph{padding:24px 48px}
.tier{margin-bottom:20px}
.tier-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tier-head .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;white-space:nowrap}
.tier-head .line{flex:1;height:1px;background:var(--border)}
.tier-head .num{font-size:11px;color:var(--muted)}
.atoms{display:flex;flex-wrap:wrap;gap:5px}
.a{padding:4px 10px;border:1px solid var(--border);background:var(--s1);font-size:11px;cursor:default;white-space:nowrap;border-radius:2px;transition:background 0.1s,border-color 0.1s}
.a:hover{background:var(--s2);border-color:var(--dim)}
.a[data-p="1"]{border-left:3px solid var(--ph1)}
.a[data-p="2"]{border-left:3px solid var(--ph2)}
.a[data-p="3"]{border-left:3px solid var(--ph3)}
.a[data-p="4"]{border-left:3px solid var(--ph4)}
.a .id{color:var(--dim);margin-right:5px;font-family:monospace;font-size:10px}
.a .nm{color:var(--text)}
.a .sz{color:var(--muted);margin-left:4px;font-size:9px}
.a.hi{background:rgba(68,170,153,0.15);border-color:var(--ph1)}
.a.dep{background:rgba(200,170,50,0.1);border-color:#ca3}
.a.gone{display:none}
.tip{position:fixed;background:#1a1a1a;border:1px solid #333;padding:14px 18px;font-size:12px;max-width:340px;z-index:999;display:none;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.6);pointer-events:none}
.tip .tid{color:var(--ph1);font-weight:700;font-size:13px;margin-bottom:2px}
.tip .tnm{margin-bottom:8px}
.tip .td{color:var(--dim);font-size:11px;margin-bottom:3px}
.tip .td b{color:#ca3;font-weight:400}
.tip .tf{color:var(--dim);font-size:11px}
.tip .tf b{color:var(--ph1);font-weight:400}
.legend{padding:14px 48px;border-top:1px solid var(--border);display:flex;gap:20px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:10px;border:1px solid;vertical-align:middle;margin-right:4px;border-radius:1px}
.legend .c1{border-color:var(--ph1);border-left:3px solid var(--ph1)}
.legend .c2{border-color:var(--ph2);border-left:3px solid var(--ph2)}
.legend .c3{border-color:var(--ph3);border-left:3px solid var(--ph3)}
.legend .c4{border-color:var(--ph4);border-left:3px solid var(--ph4)}
</style>
</head>
<body>
<div class="header">
<h1>Build Order — Dependency Graph</h1>
<p>266 atoms · 8 Phase 1 tiers · 4 Phase 2 tiers · Hover to see deps · Click to lock</p>
</div>
<div class="controls">
<span>Phases:</span>
<button class="ph on" data-p="1">Phase 1 (127)</button>
<button class="ph" data-p="2">Phase 2 (91)</button>
<button class="ph" data-p="3">Phase 3 (30)</button>
<button class="ph" data-p="4">Phase 4 (13)</button>
<div id="count">127 visible</div>
</div>
<div id="graph"></div>
<div class="legend">
<div><i class="c1"></i>Phase 1</div>
<div><i class="c2"></i>Phase 2</div>
<div><i class="c3"></i>Phase 3</div>
<div><i class="c4"></i>Phase 4</div>

// Tier 7

["ON-10","Completion ritual",1,7,"M",["IC-01","EX-01"]],
["IC-33","Micro-share",1,7,"S",["EX-05","ON-10"]],
["IC-32","Safety bar",1,7,"S",["PD-04","EX-01"]],
];

// Build lookup and feeds
var map = {};
D.forEach(function(d){ map[d[0]] = {id:d[0],nm:d[1],ph:d[2],tier:d[3],sz:d[4],deps:d[5],feeds:[]}; });
D.forEach(function(d){ d[5].forEach(function(dep){ if(map[dep]) map[dep].feeds.push(d[0]); }); });

// State
var phases = {1:true, 2:false, 3:false, 4:false};
var locked = null;

// Render
function render(){
  var vis = D.filter(function(d){ return phases[d[2]]; });
  var tiers = {};
  vis.forEach(function(d){
    var k = d[3];
    if(!tiers[k]) tiers[k] = [];
    tiers[k].push(d);
  });
  var keys = Object.keys(tiers).map(Number).sort(function(a,b){return a-b;});
  var html = "";
  keys.forEach(function(k){
    var atoms = tiers[k];
    html += '<div class="tier"><div class="tier-head"><span class="label">Tier '+k+'</span><div class="line"></div><span class="num">'+atoms.length+' atoms</span></div><div class="atoms">';
    atoms.forEach(function(d){
      html += '<div class="a" data-p="'+d[2]+'" data-id="'+d[0]+'"><span class="id">'+d[0]+'</span><span class="nm">'+d[1]+'</span><span class="sz">'+d[4]+'</span></div>';
    });
    html += '</div></div>';
  });
  document.getElementById("graph").innerHTML = html;
  document.getElementById("count").textContent = vis.length + " visible";

  // Re-attach events
  document.querySelectorAll(".a").forEach(function(el){
    el.addEventListener("mouseenter", function(e){ showTip(e, el.getAttribute("data-id")); });
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", function(){ toggleLock(el.getAttribute("data-id")); });
  });
}

function showTip(e, id){
  var a = map[id];
  if(!a) return;
  var depStr = a.deps.length ? a.deps.join(", ") : "none";
  var feedStr = a.feeds.length ? a.feeds.join(", ") : "none";
  var tip = document.getElementById("tip");
  tip.innerHTML = '<div class="tid">'+a.id+'</div><div class="tnm">'+a.nm+'</div><div class="td">← Depends on: <b>'+depStr+'</b></div><div class="tf">→ Feeds into: <b>'+feedStr+'</b></div>';
  tip.style.display = "block";
  var x = Math.min(e.clientX + 14, window.innerWidth - 360);
  var y = Math.min(e.clientY + 14, window.innerHeight - 100);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
  if(!locked) highlight(id);
}

function hideTip(){
  document.getElementById("tip").style.display = "none";
  if(!locked) clearHL();
}

function highlight(id){
  clearHL();
  var a = map[id];
  if(!a) return;
  var el = document.querySelector('[data-id="'+id+'"]');
  if(el) el.classList.add("hi");
  a.deps.forEach(function(d){
    var del = document.querySelector('[data-id="'+d+'"]');
    if(del) del.classList.add("dep");
  });
  a.feeds.forEach(function(f){
    var fel = document.querySelector('[data-id="'+f+'"]');
    if(fel) fel.classList.add("hi");
  });
}

function clearHL(){
  document.querySelectorAll(".a").forEach(function(el){ el.classList.remove("hi","dep"); });
}

function toggleLock(id){
  if(locked === id){ locked = null; clearHL(); }
  else { locked = id; highlight(id); }
}

// Phase buttons
document.querySelectorAll("button.ph").forEach(function(btn){
  btn.addEventListener("click", function(){
    var p = parseInt(btn.getAttribute("data-p"));
    phases[p] = !phases[p];
    if(phases[p]) btn.classList.add("on");
    else btn.classList.remove("on");
    locked = null;
    render();
  });
});

// Init
render();
</script>
</body>
</html>
